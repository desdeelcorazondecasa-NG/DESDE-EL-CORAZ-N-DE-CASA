<style>
:root{
  --ink:#211C18;
  --night:#1E2A2E;
  --night2:#152022;
  --paper:#F8F3E9;
  --lamp:#D69A42;
  --lamp2:#F0C47C;
  --line:rgba(33,28,24,.14)
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Karla',Arial,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased
}
h1{
  font-family:'Fraunces',Georgia,serif;
  line-height:1.08;
  margin:0
}
.page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:42px 20px;
  background:
    radial-gradient(circle at 80% 8%,rgba(214,154,66,.16),transparent 32%),
    linear-gradient(180deg,var(--night),var(--night2))
}
.card{
  width:min(680px,100%);
  background:var(--paper);
  border-radius:22px;
  padding:42px;
  box-shadow:0 30px 90px rgba(0,0,0,.28);
  text-align:center
}
.eyebrow{
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.11em;
  font-weight:700;
  color:var(--lamp);
  margin-bottom:14px
}
.card h1{
  font-size:clamp(2.15rem,7vw,3.5rem)
}
.lead{
  font-size:1.08rem;
  color:rgba(33,28,24,.72);
  margin:18px auto 28px;
  max-width:34em
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:56px;
  padding:16px 24px;
  border-radius:9px;
  text-decoration:none;
  font-weight:700;
  width:100%;
  background:var(--lamp);
  color:#1b140b
}
.btn:hover{
  background:var(--lamp2)
}
.help{
  font-size:.9rem;
  color:rgba(33,28,24,.62);
  margin:20px 0 0
}
.help a{
  font-weight:700;
  color:inherit
}
@media(max-width:600px){
  .card{padding:30px 22px}
  .page{padding:24px 14px}
}
</style>
</head>

<body>

<main class="page">
  <section class="card">
    <div class="eyebrow">Compra completada</div>
    <h1>Gracias por dar este paso.</h1>

    <p class="lead">
      Tus materiales ya están listos. Puedes verlos directamente desde la carpeta
      o descargarlos para tenerlos siempre a mano.
    </p>

    <a
      class="btn"
      href="https://drive.google.com/drive/folders/1KbRpdf_cDpbQ-ZuDHgvmLr1Ppoyju02M?usp=sharing"
      target="_blank"
      rel="noopener"
    >
      Acceder a mis materiales →
    </a>

    <p class="help">
      Si tienes alguna duda, escríbenos a
      <a href="mailto:desdeelcorazondecasa@gmail.com">
        desdeelcorazondecasa@gmail.com
      </a>.
    </p>
  </section>
</main>

<!-- Meta Pixel: registrar compra aprobada -->
<script>
(function () {
  const params = new URLSearchParams(window.location.search);

  const status = params.get('status');
  const paymentId = params.get('payment_id');

  if (status === 'approved' && paymentId) {
    const purchaseKey = 'meta_purchase_' + paymentId;

    if (!localStorage.getItem(purchaseKey)) {
      if (typeof fbq === 'function') {
        fbq('track', 'Purchase', {
          value: 9999,
          currency: 'ARS',
          content_ids: ['mama-papa-pack'],
          content_type: 'product',
          num_items: 1
        });

        localStorage.setItem(purchaseKey, '1');
      }
    }
  }
})();
</script>

</body>
</html>
